[project]
name = "micro1-hackathon"
version = "0.1.0"
description = "micro1 Agentic Workflows Hackathon entry — solo, 2026-08-28 to 2026-08-31"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1,<2",
    "pyyaml>=6",
    "jsonschema>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
art30 = "art30.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["art30"]
